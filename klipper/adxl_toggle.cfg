# ADXL345 include toggle macros (installed as its own file and pulled in
# from printer.cfg via [include adxl_toggle.cfg]).
# The adxl_toggle_watcher service reacts to the RESPOND markers below.

[gcode_macro ENABLE_ADXL]
description: Enable [include adxl345.cfg] in printer.cfg and firmware_restart
gcode:
    RESPOND MSG="ADXL_TOGGLE_EVENT:ENABLE"

[gcode_macro DISABLE_ADXL]
description: Disable [include adxl345.cfg] in printer.cfg and firmware_restart
gcode:
    RESPOND MSG="ADXL_TOGGLE_EVENT:DISABLE"

[gcode_macro ADXL_STATUS]
description: Report whether the ADXL345 include is currently active
gcode:
    RESPOND MSG="ADXL_STATUS_REQUEST"
